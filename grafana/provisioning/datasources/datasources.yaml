apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    editable: false
    jsonData:
      timeInterval: 1s

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: fraud_user
    uid: postgres
    editable: false
    jsonData:
      database: fraud_db
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: fraud_pass
