global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: fraud-scorer
    scrape_interval: 1s
    static_configs:
      - targets: ["fraud_detector:8000"]
        labels:
          service: fraud_detector

  - job_name: score-sink
    scrape_interval: 1s
    static_configs:
      - targets: ["scoring_writer:8001"]
        labels:
          service: scoring_writer

  - job_name: host-node
    scrape_interval: 1s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node_exporter
